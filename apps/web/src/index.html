    <!--
      Resolución del tema ANTES del primer pintado. Sin esto, un usuario en modo
      oscuro ve un destello blanco en cada carga. Debe ser inline y síncrono.
      Precedencia: localStorage → prefers-color-scheme → light.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('dps-theme'); // 'light' | 'dark' | 'system'
          var mode = stored === 'light' || stored === 'dark' ? stored : 'system';
          var dark =
            mode === 'dark' ||
            (mode === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', mode);
          var meta = document.getElementById('theme-color-meta');
          if (meta) meta.setAttribute('content', dark ? '#131313' : '#F9F9F9');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'system');
        }
      })();
    </script>

    <link rel="preconnect" href="/" />
    <link
      rel="preload"

    <link
