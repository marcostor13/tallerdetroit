<div class="flex min-h-dvh flex-col bg-surface">
  <div class="flex justify-end p-4">
    <dps-theme-toggle />
  </div>

  <main
    id="contenido"
    class="flex flex-1 items-center justify-center px-margin-mobile pb-16 md:px-gutter"
  >
    <div class="w-full max-w-[420px]">
      <div class="mb-8 flex flex-col items-center gap-6 text-center">
        <dps-logo variant="lockup" [height]="48" />
        <div>
          <h1 class="font-headline text-headline-lg-mobile text-on-surface">Informes técnicos</h1>
          <p class="mt-2 text-body-md text-secondary">
            Accede con tu cuenta corporativa para continuar.
          </p>
        </div>
      </div>

      <div class="dps-card p-6 md:p-8">
        <form [formGroup]="form" (ngSubmit)="submit()" novalidate class="flex flex-col gap-6">
          @if (serverError()) {
            <div
              class="flex items-start gap-2 rounded border border-error bg-error-container p-3 text-body-sm text-on-error-container"
              role="alert"
            >
              <dps-icon name="error" [size]="20" class="mt-0.5 shrink-0" />
              <span>{{ serverError() }}</span>
            </div>
          }

          <dps-field label="Correo corporativo" [error]="emailError()" #emailField>
            <input
              type="email"
              class="dps-input"
              [id]="emailField.fieldId"
              formControlName="email"
              placeholder="nombre@detroitpower.pe"
              autocomplete="username"
              inputmode="email"
              spellcheck="false"
              [attr.aria-invalid]="emailError() ? 'true' : null"
              [attr.aria-describedby]="emailField.describedBy()"
              (blur)="markTouched()"
            />
          </dps-field>

          <dps-field label="Contraseña" [error]="passwordError()" #passField>
            <div class="relative">
              <input
                [type]="showPassword() ? 'text' : 'password'"
                class="dps-input pr-12"
                [id]="passField.fieldId"
                formControlName="password"
                placeholder="••••••••••••"
                autocomplete="current-password"
                [attr.aria-invalid]="passwordError() ? 'true' : null"
                [attr.aria-describedby]="passField.describedBy()"
                (blur)="markTouched()"
              />
              <button
                type="button"
                class="absolute right-1 top-1/2 flex h-10 w-10 -translate-y-1/2 items-center justify-center rounded text-secondary transition-colors hover:bg-surface-container"
                (click)="togglePassword()"
                [attr.aria-pressed]="showPassword()"
              >
                <dps-icon
                  [name]="showPassword() ? 'visibility_off' : 'visibility'"
                  [size]="20"
                  [label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                />
              </button>
            </div>
          </dps-field>

          <button
            type="submit"
            class="dps-btn dps-btn--primary w-full"
            [disabled]="submitting()"
            [attr.aria-busy]="submitting()"
          >
            @if (submitting()) {
              <dps-icon name="progress_activity" [size]="20" class="animate-spin" />
              Verificando…
            } @else {
              Iniciar sesión
            }
          </button>
        </form>
      </div>

      <p class="mt-6 text-center font-mono text-label-sm uppercase text-gray-medium">
        Detroit Power System Perú
      </p>
    </div>
  </main>
</div>
