server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Coolify/Traefik ya termina TLS; aquí solo cabeceras de aplicación.
    add_header X-Content-Type-Options    "nosniff"                      always;
    add_header X-Frame-Options           "DENY"                         always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "camera=(self), geolocation=(), microphone=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin"                 always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json font/woff2;

    # Assets con hash en el nombre: inmutables.
    location ~* \.(?:js|css|woff2|png|jpg|jpeg|webp|avif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # El service worker y el manifest NUNCA se cachean:
    # de lo contrario la PWA queda anclada a una versión vieja.
    location = /ngsw.json          { add_header Cache-Control "no-cache"; }
    location = /ngsw-worker.js     { add_header Cache-Control "no-cache"; }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA: cualquier ruta desconocida la resuelve el router de Angular.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
